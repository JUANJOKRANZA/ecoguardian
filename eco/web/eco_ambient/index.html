<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--ink:#f4f7ef;--sub:#c9d8c8;--lime:#c5e68a;--green:#4cb97b;--deep:#06240f}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink)}
#panel{display:none}
.card{margin:2px;padding:14px;border-radius:18px;border:1px solid rgba(197,230,138,.35);
 background:radial-gradient(120% 140% at 0% 0%,#1d5a3a 0%,#123824 48%,#0c2518 100%);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.head{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:0 0 44px;width:44px;height:44px;border-radius:14px;background:rgba(197,230,138,.14);border:1px solid rgba(197,230,138,.4);display:grid;place-items:center}
.titles{flex:1;min-width:0}
.name{font-weight:800;font-size:1rem;line-height:1.2;letter-spacing:.01em}
.song{font-size:.78rem;color:var(--sub);line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.pill{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:999px;padding:4px 10px;border:1px solid transparent;white-space:nowrap}
.pill.on{background:var(--lime);color:var(--deep)}
.pill.off{background:#24382c;color:#e8efe4;border-color:rgba(232,239,228,.35)}
.pill.warn{background:#f4d58d;color:#3a2a00}
.row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.play{flex:0 0 56px;width:56px;height:56px;border-radius:50%;border:0;background:var(--green);color:var(--deep);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 #2c7a4d}
.play:hover{filter:brightness(1.08)}.play:active{transform:translateY(2px);box-shadow:0 2px 0 #2c7a4d}
.play:disabled{opacity:.55;cursor:wait}
.play:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.vol{flex:1 1 150px;min-width:140px}
.vol label{display:block;font-size:.76rem;font-weight:700;color:var(--sub);margin-bottom:4px}
.vr{display:flex;align-items:center;gap:8px}
.vr svg{flex:0 0 20px}
input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--lime);background:transparent;cursor:pointer}
output{flex:0 0 46px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lime);font-size:.95rem}
.eq{display:flex;align-items:flex-end;gap:3px;height:16px;margin-top:12px}
.eq i{display:block;width:4px;height:4px;border-radius:2px;background:var(--lime);opacity:.45}
.playing .eq i{opacity:1;animation:bar 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}
@media(prefers-reduced-motion:reduce){.playing .eq i{animation:none;height:10px}}
.msg{margin-top:10px;font-size:.8rem;line-height:1.4;color:var(--ink);min-height:1.1em}
.msg.err{background:#f4d58d;color:#3a2a00;border-radius:10px;padding:8px 10px;font-weight:600}
.note{margin-top:6px;font-size:.72rem;color:var(--sub);line-height:1.35}
@media(max-width:360px){.name{font-size:.92rem}.pill{font-size:.68rem}}
</style></head><body>
<div id="panel"><div class="card" id="card">
 <div class="head">
  <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c5e68a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c2-5 5-8 9-10"/></svg></div>
  <div class="titles"><div class="name">EcoGuardian · Ambiente</div><div class="song">Reciclar – El medio ambiente vamos a cuidar</div></div>
  <span class="pill off" id="pill" role="status">Pausado</span>
 </div>
 <div class="row">
  <button class="play" id="play" type="button" aria-label="Reproducir música ambiental"></button>
  <div class="vol"><label for="vol">Volumen</label>
   <div class="vr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c5e68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    <input id="vol" type="range" min="0" max="100" step="1" value="10" aria-label="Volumen de la música ambiental"><output id="pct" for="vol">10 %</output></div></div>
 </div>
 <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
 <div class="msg" id="msg" aria-live="polite"></div>
 <div class="note" id="note"></div>
</div></div>
<script src="controller.js"></script>
<script>
(function () {
  'use strict';
  var SONG = 'reciclar_ambiente.mp3';
  var PLAY_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  var MSG = {
    load: 'No se pudo cargar la canción ambiental. Revisa tu conexión y vuelve a pulsar «Reproducir».',
    decode: 'Tu navegador no pudo decodificar la canción ambiental.',
    play: 'No se pudo iniciar la reproducción. Pulsa «Reproducir» para intentarlo de nuevo.'
  };
  var parentWin = null, ctrl = null, unsub = null, args = {}, ready = false, lastH = -1;

  function post(m) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, m), '*'); }
  function setHeight(h) { if (h !== lastH) { lastH = h; post({ type: 'streamlit:setFrameHeight', height: h }); } }

  function install() {
    try {
      parentWin = window.parent;
      var P = parentWin;
      void P.document.body;                                   // falla si no hay acceso al documento principal
      var cur = P.__egAmbient;
      if (!cur || cur.version !== window.egAmbientFactory.__v) {
        var s = P.document.createElement('script');
        s.id = 'eg-ambient-controller';
        s.textContent = '(' + window.egAmbientFactory.toString() + ')(window,document);';
        P.document.head.appendChild(s);
      }
      return P.__egAmbient || null;
    } catch (e) { return null; }
  }

  function songUrl() {
    var u = new URL(SONG, window.location.href);
    if (parentWin && u.origin !== parentWin.location.origin) return '';  // solo recurso local del mismo origen
    return u.href;
  }

  function render(s) {
    var pill = document.getElementById('pill'), btn = document.getElementById('play'),
        msg = document.getElementById('msg'), note = document.getElementById('note'),
        vol = document.getElementById('vol'), pct = document.getElementById('pct'),
        card = document.getElementById('card');
    var v = Math.round(s.volume * 100);
    if (document.activeElement !== vol) vol.value = String(v);
    pct.textContent = v + ' %';
    vol.setAttribute('aria-valuetext', v + ' por ciento');
    vol.style.background = 'linear-gradient(90deg,#c5e68a ' + v + '%,rgba(244,247,239,.25) ' + v + '%) center/100% 6px no-repeat';
    card.classList.toggle('playing', s.playing);
    var label, cls;
    if (s.playing) { label = s.ducked ? 'Reproduciendo (atenuada)' : 'Reproduciendo'; cls = 'on'; }
    else if (s.blocked) { label = 'Bloqueado por el navegador'; cls = 'warn'; }
    else if (s.gamePaused) { label = 'En pausa por el juego'; cls = 'off'; }
    else if (s.loading && s.wantPlay) { label = 'Cargando…'; cls = 'off'; }
    else if (s.error) { label = 'Error'; cls = 'warn'; }
    else { label = 'Pausado'; cls = 'off'; }
    pill.textContent = label; pill.className = 'pill ' + cls;
    var wantsPause = s.playing || s.gamePaused;
    btn.innerHTML = wantsPause ? PAUSE_SVG : PLAY_SVG;
    btn.setAttribute('aria-label', wantsPause ? 'Pausar música ambiental' : 'Reproducir música ambiental');
    btn.title = wantsPause ? 'Pausar' : 'Reproducir';
    btn.disabled = false;
    msg.className = 'msg'; msg.textContent = '';
    if (s.error) { msg.className = 'msg err'; msg.textContent = MSG[s.error] || MSG.play; }
    else if (s.blocked) { msg.className = 'msg err'; msg.textContent = 'Tu navegador bloqueó el inicio automático. Toca cualquier parte de la página o pulsa reproducir y empezará.'; }
    else if (s.loading && s.wantPlay) { msg.textContent = 'Preparando la canción…'; }
    else if (s.gamePaused) { msg.textContent = 'La música volverá sola cuando salgas del juego.'; }
    else if (s.ducked && s.playing) { msg.textContent = 'Volumen reducido mientras juegas.'; }
    else if (!s.playing) { msg.textContent = 'Pulsa reproducir para escuchar la canción ambiental.'; }
    note.textContent = s.volumeFixed ? 'En este dispositivo el volumen se regula con los botones físicos del equipo.' : '';
    setHeight(Math.ceil(card.getBoundingClientRect().height) + 8);
  }

  function boot() {
    if (!args.ui) { setHeight(0); }
    ctrl = install();
    if (!ctrl) {
      if (args.ui) {
        document.getElementById('panel').style.display = 'block';
        document.getElementById('msg').className = 'msg err';
        document.getElementById('msg').textContent = 'Este navegador no permite controlar el audio ambiental entre páginas.';
        document.getElementById('play').disabled = true;
        setHeight(Math.ceil(document.getElementById('card').getBoundingClientRect().height) + 8);
      }
      return;
    }
    ctrl.configure({ src: songUrl(), enabled: args.enabled !== false, mode: args.mode, defaultVolume: args.defaultVolume, autoStart: args.autoStart === true });
    if (!args.ui || unsub) return;
    document.getElementById('panel').style.display = 'block';
    ctrl.preload();                                             // descarga la canción una vez al abrir el panel
    unsub = ctrl.subscribe(render);
    if (window.ResizeObserver) {                                // la altura del iframe sigue al contenido (móvil, mensajes largos)
      new ResizeObserver(function () { setHeight(Math.ceil(document.getElementById('card').getBoundingClientRect().height) + 8); })
        .observe(document.getElementById('card'));
    }
    document.getElementById('play').addEventListener('click', function () {
      var s = ctrl.getState();
      if (s.playing || s.gamePaused) ctrl.pause(); else ctrl.play();
    });
    document.getElementById('vol').addEventListener('input', function (e) {
      ctrl.setVolume(Number(e.target.value) / 100);            // modifica audio.volume real
    });
    window.addEventListener('pagehide', function () { if (unsub) unsub(); });
  }

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'streamlit:render') return;
    args = e.data.args || {};
    if (!ready) { ready = true; boot(); }
    else if (ctrl) { ctrl.configure({ src: songUrl(), enabled: args.enabled !== false, mode: args.mode, defaultVolume: args.defaultVolume, autoStart: args.autoStart === true }); }
  });
  post({ type: 'streamlit:componentReady', apiVersion: 1 });
  post({ type: 'streamlit:setFrameHeight', height: 0 });
})();
</script></body></html>
